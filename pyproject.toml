# Lets Vercel deploy the FastAPI API when the project is built from the repository root.
# (Locally, keep using backend/requirements.txt and `uvicorn app.main:app` from backend/.)
[project]
name = "lakshmi-erp-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "segno>=1.6",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
