# Render Blueprint – Lakshmi Machine ERP (LCC): FastAPI API + Next.js web.
# New → Blueprint → Aavoraa/LCC. Render asks for DATABASE_URL (PostgreSQL, e.g. a free Neon database).
# JWT_SECRET and the admin's first password (SEED_PASSWORD) are generated by Render – read the password
# in lcc-api → Environment, sign in as "admin", then change it.
# Free plan: services sleep after 15 min idle; the first request then takes about a minute.
services:
  - type: web
    name: lcc-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations + idempotent seed (roles, permissions, admin user), then the API.
    startCommand: python -m alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # PostgreSQL connection string (Neon: use the direct, non-pooled URL with sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true # first password of the "admin" login
      - key: ADMIN_USERNAME
        value: admin
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: lcc-web
          property: host
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: lcc-web
          property: host

  - type: web
    name: lcc-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lcc-api
          property: host
